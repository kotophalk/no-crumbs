<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Geist Mono';src:url('GeistMono-Variable.woff2') format('woff2');font-weight:100 900}
html,body{margin:0;padding:0}
body{width:256px;height:256px;background:#171717;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:32px 32px;background-position:-0.5px -0.5px}
.t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 72px/1 'Geist Mono',monospace;color:#fff;letter-spacing:-.02em;white-space:nowrap}
.t span{color:#a3a3a3}
</style></head><body><div class="grid"></div><div class="t"><span>[</span>&nbsp;ОК&nbsp;<span>]</span></div></body></html>
